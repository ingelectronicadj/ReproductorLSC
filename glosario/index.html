<!DOCTYPE html>
<html lang="es">

<head>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<meta name="description" content="Glosario Matemático en Lengua de Señas Colombiana (LSC) con videos demostrativos, filtros por categoría y modo de práctica interactiva." />
	<title>Glosario Matemático LSC · Lengua de Señas Colombiana</title>
	<link rel="shortcut icon" href="../images/favicon.png" />
	<style>
		:root {
			--bg-page: #f4f4f5;
			--bg-card: #ffffff;
			--text-main: #18181b;
			--text-muted: #52525b;
			--border: #e4e4e7;
			--border-hover: #a1a1aa;
			--primary: #18181b;
			--focus-ring: #3b82f6;
		}

		* {
			box-sizing: border-box;
		}

		body {
			margin: 0;
			padding: 0;
			font-family: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", Roboto, sans-serif;
			background-color: var(--bg-page);
			color: var(--text-main);
			line-height: 1.5;
			-webkit-font-smoothing: antialiased;
		}

		.ico {
			display: inline-block;
			width: 14px;
			height: 14px;
			position: relative;
			vertical-align: middle;
			flex-shrink: 0;
		}

		.ico-play::before {
			content: "";
			position: absolute;
			top: 2px;
			left: 3px;
			width: 0;
			height: 0;
			border-top: 5px solid transparent;
			border-bottom: 5px solid transparent;
			border-left: 9px solid currentColor;
		}

		.ico-pause::before,
		.ico-pause::after {
			content: "";
			position: absolute;
			top: 2px;
			width: 3px;
			height: 10px;
			background: currentColor;
			border-radius: 1px;
		}
		.ico-pause::before { left: 2px; }
		.ico-pause::after { right: 2px; }

		.ico-back::before {
			content: "";
			position: absolute;
			top: 3px;
			left: 2px;
			width: 7px;
			height: 7px;
			border-left: 1.8px solid currentColor;
			border-bottom: 1.8px solid currentColor;
			transform: rotate(45deg);
		}
		.ico-back::after {
			content: "";
			position: absolute;
			top: 6px;
			left: 2px;
			width: 10px;
			height: 1.8px;
			background: currentColor;
		}

		header.glossary-header {
			background: var(--bg-card);
			border-bottom: 1px solid var(--border);
			padding: 14px 24px;
		}

		.header-inner {
			max-width: 1120px;
			margin: 0 auto;
			display: flex;
			align-items: center;
			justify-content: space-between;
			flex-wrap: wrap;
			gap: 12px;
		}

		.header-title {
			margin: 0;
			font-size: 1.05rem;
			font-weight: 700;
			color: var(--text-main);
		}

		.toolbar {
			display: flex;
			align-items: center;
			flex-wrap: wrap;
			gap: 8px;
		}

		.search-input {
			padding: 7px 12px;
			border-radius: 8px;
			border: 1px solid #d4d4d8;
			background: #fafafa;
			font-size: 0.86rem;
			min-width: 220px;
			color: var(--text-main);
		}

		.btn {
			background: var(--bg-card);
			color: var(--text-main);
			border: 1px solid #d4d4d8;
			border-radius: 8px;
			padding: 7px 12px;
			font-size: 0.84rem;
			font-weight: 600;
			cursor: pointer;
			text-decoration: none;
			display: inline-flex;
			align-items: center;
			gap: 6px;
			transition: background 0.15s ease, border-color 0.15s ease;
		}

		.btn:hover {
			background: #f4f4f5;
			border-color: var(--border-hover);
		}

		.btn[aria-pressed="true"],
		.btn-primary {
			background: var(--primary);
			color: #ffffff;
			border-color: var(--primary);
		}

		.btn[aria-pressed="true"]:hover,
		.btn-primary:hover {
			background: #27272a;
		}

		.btn:focus-visible,
		.search-input:focus-visible,
		.cat-btn:focus-visible,
		.quiz-option-btn:focus-visible {
			outline: 2px solid var(--focus-ring);
			outline-offset: 2px;
		}

		main {
			max-width: 1120px;
			margin: 20px auto;
			padding: 0 16px 40px;
		}

		.category-bar {
			display: flex;
			flex-wrap: wrap;
			gap: 6px;
			margin-bottom: 16px;
		}

		.cat-btn {
			background: var(--bg-card);
			color: var(--text-muted);
			border: 1px solid var(--border);
			border-radius: 8px;
			padding: 6px 12px;
			font-size: 0.82rem;
			font-weight: 600;
			cursor: pointer;
			transition: all 0.15s ease;
		}

		.cat-btn:hover {
			color: var(--text-main);
			border-color: var(--border-hover);
		}

		.cat-btn[aria-pressed="true"] {
			background: var(--primary);
			color: #ffffff;
			border-color: var(--primary);
		}

		.glossary-grid {
			display: grid;
			grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
			gap: 16px;
		}

		.term-card {
			background: var(--bg-card);
			border: 1px solid var(--border);
			border-radius: 12px;
			overflow: hidden;
			display: flex;
			flex-direction: column;
			transition: border-color 0.15s ease, box-shadow 0.15s ease;
		}

		.term-card:hover {
			border-color: #d4d4d8;
			box-shadow: 0 4px 16px rgba(0, 0, 0, 0.05);
		}

		.term-card.is-highlighted {
			border-color: var(--primary);
			box-shadow: 0 0 0 2px var(--primary);
		}

		.term-card-body {
			display: grid;
			grid-template-columns: 116px 1fr;
			gap: 14px;
			padding: 14px;
			flex: 1;
			align-items: center;
		}

		.video-box {
			position: relative;
			width: 116px;
			height: 160px;
			background: #18181b;
			border-radius: 8px;
			overflow: hidden;
			display: flex;
			align-items: center;
			justify-content: center;
		}

		.video-box video {
			width: 100%;
			height: 100%;
			object-fit: cover;
		}

		.term-category-tag {
			display: inline-block;
			font-size: 0.7rem;
			font-weight: 600;
			text-transform: uppercase;
			letter-spacing: 0.03em;
			color: var(--text-muted);
			margin-bottom: 4px;
		}

		.term-info h2 {
			margin: 0 0 6px;
			font-size: 1rem;
			font-weight: 700;
			color: var(--text-main);
		}

		.term-info p {
			margin: 0 0 8px;
			font-size: 0.88rem;
			color: var(--text-muted);
		}

		.formula-box {
			display: flex;
			align-items: center;
			flex-wrap: wrap;
			gap: 8px;
			margin-top: 6px;
		}

		.formula-box img {
			max-height: 26px;
			width: auto;
		}

		.term-card-footer {
			background: #fafafa;
			padding: 8px 14px;
			border-top: 1px solid var(--border);
			display: flex;
			align-items: center;
		}

		.btn-play-sign {
			width: 100%;
			justify-content: center;
		}

		.empty-state {
			background: var(--bg-card);
			border: 1px solid var(--border);
			padding: 24px;
			border-radius: 10px;
			text-align: center;
			font-weight: 500;
			color: var(--text-muted);
		}

		/* Modo Práctica limpio */
		.quiz-panel {
			background: var(--bg-card);
			border: 1px solid var(--border);
			border-radius: 12px;
			padding: 20px;
			margin-bottom: 20px;
		}

		.quiz-panel[hidden] {
			display: none !important;
		}

		.quiz-layout {
			display: grid;
			grid-template-columns: 180px 1fr;
			gap: 20px;
			align-items: center;
		}

		@media (max-width: 640px) {
			.quiz-layout {
				grid-template-columns: 1fr;
				justify-items: center;
			}
		}

		.quiz-video-wrap {
			width: 170px;
			height: 236px;
			background: #18181b;
			border-radius: 8px;
			overflow: hidden;
		}

		.quiz-video-wrap video {
			width: 100%;
			height: 100%;
			object-fit: cover;
		}

		.quiz-options {
			display: grid;
			grid-template-columns: repeat(auto-fit, minmax(190px, 1fr));
			gap: 8px;
			margin-top: 12px;
		}

		.quiz-option-btn {
			background: #fafafa;
			color: var(--text-main);
			border: 1px solid #d4d4d8;
			border-radius: 8px;
			padding: 10px 14px;
			font-size: 0.9rem;
			font-weight: 600;
			cursor: pointer;
			text-align: left;
		}

		.quiz-option-btn:hover {
			border-color: var(--primary);
			background: #f4f4f5;
		}

		.quiz-option-btn.is-correct {
			background: #f0fdf4;
			border-color: #16a34a;
			color: #14532d;
		}

		.quiz-option-btn.is-wrong {
			background: #fef2f2;
			border-color: #dc2626;
			color: #7f1d1d;
		}

		.quiz-feedback {
			margin-top: 12px;
			font-weight: 600;
			font-size: 0.92rem;
		}
	</style>
</head>

<body>
	<header class="glossary-header">
		<div class="header-inner">
			<h1 class="header-title">Glosario Matemático en LSC</h1>
			<div class="toolbar">
				<input
					id="searchTermInput"
					type="search"
					class="search-input"
					placeholder="Buscar término..."
					aria-label="Buscar término en el glosario matemático"
				/>
				<button
					id="btnToggleQuizMode"
					type="button"
					class="btn"
					aria-pressed="false"
				>
					<span>Practicar señas</span>
				</button>
				<button
					id="btnToggleSlowMotion"
					type="button"
					class="btn"
					aria-pressed="false"
				>
					<span id="slowMotionText">Velocidad: 1×</span>
				</button>
				<a href="../index.html" class="btn" aria-label="Volver al reproductor de la clase">
					<span class="ico ico-back" aria-hidden="true"></span>
					<span>Volver</span>
				</a>
			</div>
		</div>
	</header>

	<main>
		<section id="quizPanel" class="quiz-panel" hidden aria-label="Práctica interactiva de señas matemáticas en LSC">
			<div style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; margin-bottom: 14px;">
				<h2 style="margin: 0; font-size: 1rem;">¿Qué concepto matemático representa esta seña en LSC?</h2>
				<strong id="quizScoreDisplay" style="font-size: 0.88rem; color: var(--text-muted);">Aciertos: 0 / 0</strong>
			</div>
			<div class="quiz-layout">
				<div class="quiz-video-wrap">
					<video id="quizVideo" muted loop playsinline aria-label="Video de la seña en LSC a identificar"></video>
				</div>
				<div>
					<p id="quizClueText" style="margin: 0 0 8px; color: var(--text-muted); font-size: 0.9rem;"></p>
					<div id="quizOptionsContainer" class="quiz-options" role="group" aria-label="Opciones de respuesta"></div>
					<p id="quizFeedback" class="quiz-feedback" role="status" aria-live="polite"></p>
					<button id="btnNextQuestion" type="button" class="btn btn-primary" style="margin-top: 8px;">
						<span>Siguiente seña</span>
					</button>
				</div>
			</div>
		</section>

		<nav class="category-bar" aria-label="Filtrar términos por categoría matemática">
			<button type="button" class="cat-btn" data-category="todos" aria-pressed="true">Todos (12)</button>
			<button type="button" class="cat-btn" data-category="Ecuaciones" aria-pressed="false">Ecuaciones (3)</button>
			<button type="button" class="cat-btn" data-category="Funciones" aria-pressed="false">Funciones (3)</button>
			<button type="button" class="cat-btn" data-category="Álgebra" aria-pressed="false">Polinomios y Álgebra (3)</button>
			<button type="button" class="cat-btn" data-category="Fundamentos" aria-pressed="false">Fundamentos (3)</button>
		</nav>

		<p id="resultsCount" role="status" aria-live="polite" style="font-size: 0.84rem; color: var(--text-muted); margin: 0 0 12px;">
			12 términos matemáticos en Lengua de Señas Colombiana
		</p>
		<div id="glossaryGrid" class="glossary-grid"></div>
	</main>

	<script>
		(function () {
			'use strict';

			var TERMS = [
				{
					id: 'ecuacion',
					title: 'Ecuación',
					category: 'Ecuaciones',
					video: 'media/video00.mp4',
					definition: 'Es una igualdad en la cual hay términos conocidos y términos desconocidos.',
					formulas: []
				},
				{
					id: 'raiz-cuadrada',
					title: 'Raíz Cuadrada',
					category: 'Álgebra',
					video: 'media/video01.mp4',
					definition: 'Expresión radical de índice dos.',
					formulas: [
						{ src: 'png/cuadrada.png', alt: 'Símbolo de raíz cuadrada de x' }
					]
				},
				{
					id: 'constante',
					title: 'Constante',
					category: 'Fundamentos',
					video: 'media/video02.mp4',
					definition: 'Un valor fijo C que no cambia dentro de una expresión o ecuación.',
					formulas: [
						{ src: 'png/c.png', alt: 'Constante C' }
					]
				},
				{
					id: 'funcion-cuadratica',
					title: 'Función Cuadrática',
					category: 'Funciones',
					video: 'media/video03.mp4',
					definition: 'Es una función polinómica de segundo grado definida por:',
					formulas: [
						{ src: 'png/ecuacion.png', alt: 'f(x) = ax² + bx + c' },
						{ src: 'png/cero.png', alt: 'con a diferente de 0' }
					]
				},
				{
					id: 'funcion-polinomica',
					title: 'Función Polinómica',
					category: 'Funciones',
					video: 'media/video04.mp4',
					definition: 'Es una función asociada a un polinomio con coeficientes en un anillo conmutativo (a menudo un cuerpo).',
					formulas: [
						{ src: 'png/funcion.png', alt: 'f: x tiende a P(x)' }
					]
				},
				{
					id: 'polinomio',
					title: 'Polinomio',
					category: 'Álgebra',
					video: 'media/video05.mp4',
					definition: 'Es una relación binaria de monomios, o una sucesión de sumas y restas de potencias enteras de una o de varias variables indeterminadas.',
					formulas: []
				},
				{
					id: 'ecuacion-segundo-grado',
					title: 'Ecuación de Segundo Grado',
					category: 'Ecuaciones',
					video: 'media/video06.mp4',
					definition: 'Ecuación algebraica cuadrática definida por la expresión:',
					formulas: [
						{ src: 'png/ecuacion.png', alt: 'ax² + bx + c = 0' },
						{ src: 'png/cero.png', alt: 'con a diferente de 0' }
					]
				},
				{
					id: 'ecuacion-primer-grado',
					title: 'Ecuación de Primer Grado',
					category: 'Ecuaciones',
					video: 'media/video07.mp4',
					definition: 'Polinomio o ecuación algebraica lineal (de primera potencia).',
					formulas: []
				},
				{
					id: 'formula',
					title: 'Fórmula',
					category: 'Fundamentos',
					video: 'media/video08.mp4',
					definition: 'Es una expresión algebraica que relaciona variables o cantidades.',
					formulas: []
				},
				{
					id: 'propiedad',
					title: 'Propiedad',
					category: 'Fundamentos',
					video: 'media/video09.mp4',
					definition: 'Son reglas que se obtienen a partir de los axiomas (verdades lógicas mínimas de donde nace toda la matemática) y deben ser demostradas mediante estos.',
					formulas: []
				},
				{
					id: 'funcion',
					title: 'Función',
					category: 'Funciones',
					video: 'media/video10.mp4',
					definition: 'Es el término usado para indicar la relación o correspondencia entre dos o más cantidades.',
					formulas: []
				},
				{
					id: 'monomio',
					title: 'Monomio',
					category: 'Álgebra',
					video: 'media/video11.mp4',
					definition: 'Es una expresión algebraica compuesta únicamente por un solo término.',
					formulas: []
				}
			];

			var gridEl = document.getElementById('glossaryGrid');
			var searchInput = document.getElementById('searchTermInput');
			var resultsCount = document.getElementById('resultsCount');
			var btnToggleSlowMotion = document.getElementById('btnToggleSlowMotion');
			var slowMotionText = document.getElementById('slowMotionText');
			var btnToggleQuizMode = document.getElementById('btnToggleQuizMode');
			var categoryBtns = document.querySelectorAll('.cat-btn');

			var quizPanel = document.getElementById('quizPanel');
			var quizVideo = document.getElementById('quizVideo');
			var quizClueText = document.getElementById('quizClueText');
			var quizOptionsContainer = document.getElementById('quizOptionsContainer');
			var quizFeedback = document.getElementById('quizFeedback');
			var quizScoreDisplay = document.getElementById('quizScoreDisplay');
			var btnNextQuestion = document.getElementById('btnNextQuestion');

			var playbackRate = 1.0;
			var activeCategory = 'todos';
			var highlightedTermId = null;

			var quizState = {
				correctCount: 0,
				totalCount: 0,
				currentTerm: null,
				answered: false
			};

			function normalize (str) {
				return (str || '')
					.toLowerCase()
					.normalize('NFD')
					.replace(/[\u0300-\u036f]/g, '');
			}

			function setPlayButtonContent (btnEl, isPlaying, title) {
				btnEl.innerHTML = '';
				var ico = document.createElement('span');
				ico.className = isPlaying ? 'ico ico-pause' : 'ico ico-play';
				ico.setAttribute('aria-hidden', 'true');
				var txt = document.createElement('span');
				txt.textContent = isPlaying ? 'Pausar seña' : 'Reproducir seña';
				btnEl.appendChild(ico);
				btnEl.appendChild(txt);
				btnEl.setAttribute('aria-label', (isPlaying ? 'Pausar seña en LSC de ' : 'Reproducir seña en LSC de ') + title);
			}

			function playTermVideo (videoEl, btnEl, title) {
				document.querySelectorAll('.glossary-grid video').forEach(function (v) {
					if (v !== videoEl) {
						v.pause();
					}
				});

				videoEl.playbackRate = playbackRate;
				if (videoEl.paused) {
					videoEl.currentTime = 0;
					videoEl.play().catch(function () {});
					setPlayButtonContent(btnEl, true, title);
				} else {
					videoEl.pause();
					setPlayButtonContent(btnEl, false, title);
				}
			}

			function renderCards () {
				var query = normalize(searchInput.value);
				var filtered = TERMS.filter(function (item) {
					var matchesCategory = activeCategory === 'todos' || item.category === activeCategory;
					var matchesQuery = !query || normalize(item.title + ' ' + item.definition + ' ' + item.category).indexOf(query) !== -1;
					return matchesCategory && matchesQuery;
				});

				gridEl.innerHTML = '';
				resultsCount.textContent = 'Mostrando ' + filtered.length + ' de ' + TERMS.length + ' términos';

				if (filtered.length === 0) {
					var empty = document.createElement('div');
					empty.className = 'empty-state';
					empty.textContent = 'No se encontraron términos que coincidan con tu búsqueda.';
					gridEl.appendChild(empty);
					return;
				}

				filtered.forEach(function (item) {
					var article = document.createElement('article');
					article.id = 'term-' + item.id;
					article.className = 'term-card' + (highlightedTermId === item.id ? ' is-highlighted' : '');

					var body = document.createElement('div');
					body.className = 'term-card-body';

					var videoBox = document.createElement('div');
					videoBox.className = 'video-box';

					var video = document.createElement('video');
					video.src = item.video;
					video.preload = 'metadata';
					video.muted = true;
					video.loop = true;
					video.playsInline = true;
					video.setAttribute('aria-label', 'Seña en LSC para ' + item.title);

					videoBox.appendChild(video);

					var info = document.createElement('div');
					info.className = 'term-info';

					var catTag = document.createElement('span');
					catTag.className = 'term-category-tag';
					catTag.textContent = item.category;

					var h2 = document.createElement('h2');
					h2.textContent = item.title;

					var p = document.createElement('p');
					p.textContent = item.definition;

					info.appendChild(catTag);
					info.appendChild(h2);
					info.appendChild(p);

					if (item.formulas && item.formulas.length > 0) {
						var formulaBox = document.createElement('div');
						formulaBox.className = 'formula-box';
						item.formulas.forEach(function (f) {
							var img = document.createElement('img');
							img.src = f.src;
							img.alt = f.alt;
							formulaBox.appendChild(img);
						});
						info.appendChild(formulaBox);
					}

					body.appendChild(videoBox);
					body.appendChild(info);

					var footer = document.createElement('div');
					footer.className = 'term-card-footer';

					var playBtn = document.createElement('button');
					playBtn.type = 'button';
					playBtn.className = 'btn btn-play-sign';
					setPlayButtonContent(playBtn, false, item.title);

					playBtn.addEventListener('click', function () {
						playTermVideo(video, playBtn, item.title);
					});

					article.addEventListener('mouseenter', function () {
						video.playbackRate = playbackRate;
						video.play().catch(function () {});
						setPlayButtonContent(playBtn, true, item.title);
					});

					article.addEventListener('mouseleave', function () {
						video.pause();
						setPlayButtonContent(playBtn, false, item.title);
					});

					footer.appendChild(playBtn);
					article.appendChild(body);
					article.appendChild(footer);
					gridEl.appendChild(article);

					if (highlightedTermId === item.id) {
						setTimeout(function () {
							article.scrollIntoView({ behavior: 'smooth', block: 'center' });
							playTermVideo(video, playBtn, item.title);
						}, 150);
					}
				});
			}

			function loadNextQuizQuestion () {
				quizState.answered = false;
				quizFeedback.textContent = '';

				var randomIndex = Math.floor(Math.random() * TERMS.length);
				var target = TERMS[randomIndex];
				quizState.currentTerm = target;

				var pool = TERMS.filter(function (t) { return t.id !== target.id; });
				pool.sort(function () { return Math.random() - 0.5; });
				var choices = [target, pool[0], pool[1], pool[2]];
				choices.sort(function () { return Math.random() - 0.5; });

				quizVideo.src = target.video;
				quizVideo.playbackRate = playbackRate;
				quizVideo.play().catch(function () {});
				quizClueText.textContent = 'Definición: "' + target.definition + '"';

				quizOptionsContainer.innerHTML = '';
				choices.forEach(function (choice) {
					var btn = document.createElement('button');
					btn.type = 'button';
					btn.className = 'quiz-option-btn';
					btn.textContent = choice.title;
					btn.addEventListener('click', function () {
						if (quizState.answered) return;
						quizState.answered = true;
						quizState.totalCount += 1;

						if (choice.id === target.id) {
							quizState.correctCount += 1;
							btn.classList.add('is-correct');
							quizFeedback.textContent = 'Correcto: ' + target.title;
						} else {
							btn.classList.add('is-wrong');
							quizFeedback.textContent = 'Respuesta correcta: ' + target.title;
						}
						quizScoreDisplay.textContent = 'Aciertos: ' + quizState.correctCount + ' / ' + quizState.totalCount;
					});
					quizOptionsContainer.appendChild(btn);
				});
			}

			function toggleQuizMode (forceOpen) {
				var willOpen = typeof forceOpen === 'boolean' ? forceOpen : quizPanel.hasAttribute('hidden');
				if (willOpen) {
					quizPanel.removeAttribute('hidden');
					btnToggleQuizMode.setAttribute('aria-pressed', 'true');
					loadNextQuizQuestion();
				} else {
					quizPanel.setAttribute('hidden', '');
					btnToggleQuizMode.setAttribute('aria-pressed', 'false');
					quizVideo.pause();
				}
			}

			searchInput.addEventListener('input', function () {
				highlightedTermId = null;
				renderCards();
			});

			categoryBtns.forEach(function (btn) {
				btn.addEventListener('click', function () {
					activeCategory = btn.getAttribute('data-category');
					highlightedTermId = null;
					categoryBtns.forEach(function (b) {
						b.setAttribute('aria-pressed', String(b === btn));
					});
					renderCards();
				});
			});

			btnToggleSlowMotion.addEventListener('click', function () {
				playbackRate = playbackRate === 1.0 ? 0.5 : 1.0;
				var isSlow = playbackRate === 0.5;
				btnToggleSlowMotion.setAttribute('aria-pressed', String(isSlow));
				slowMotionText.textContent = isSlow ? 'Velocidad: 0.5×' : 'Velocidad: 1×';
				document.querySelectorAll('video').forEach(function (v) {
					v.playbackRate = playbackRate;
				});
			});

			btnToggleQuizMode.addEventListener('click', function () {
				toggleQuizMode();
			});

			btnNextQuestion.addEventListener('click', loadNextQuizQuestion);

			var params = new URLSearchParams(window.location.search);
			if (params.get('termino')) {
				highlightedTermId = params.get('termino');
			}
			if (params.get('modo') === 'practica') {
				toggleQuizMode(true);
			}

			renderCards();
		})();
	</script>
</body>

</html>
