<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="Vista previa del Reproductor Educativo LSC con pizarra matemática, ventana de intérprete en Lengua de Señas Colombiana, subtítulos sincronizados y barra de controles moderna.">
  <title>Reproductor Educativo LSC v2.0</title>
  <rect width="960" height="540" fill="#f4f4f5"/>

  <!-- Header -->
  <rect x="0" y="0" width="960" height="52" fill="#ffffff"/>
  <line x1="0" y1="52" x2="960" y2="52" stroke="#e4e4e7" stroke-width="1"/>
  <text x="48" y="31" font-family="-apple-system, BlinkMacSystemFont, Inter, Segoe UI, sans-serif" font-size="15" font-weight="700" fill="#18181b">Reproductor Educativo LSC</text>
  <rect x="248" y="16" width="166" height="22" rx="5" fill="#f4f4f5" stroke="#e4e4e7"/>
  <text x="331" y="31" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Inter, Segoe UI, sans-serif" font-size="10.5" font-weight="600" fill="#52525b">Lengua de Señas Colombiana</text>

  <rect x="690" y="13" width="92" height="26" rx="6" fill="#ffffff" stroke="#e4e4e7"/>
  <text x="736" y="30" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Inter, Segoe UI, sans-serif" font-size="11.5" font-weight="500" fill="#18181b">Glosario</text>
  <rect x="790" y="13" width="122" height="26" rx="6" fill="#ffffff" stroke="#e4e4e7"/>
  <text x="851" y="30" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Inter, Segoe UI, sans-serif" font-size="11.5" font-weight="500" fill="#18181b">Practicar señas</text>

  <!-- Player Container -->
  <rect x="48" y="72" width="864" height="378" rx="12" fill="#09090b" stroke="#27272a"/>

  <!-- Main Video Canvas (Whiteboard) -->
  <rect x="64" y="84" width="580" height="292" rx="6" fill="#ffffff"/>
  <text x="96" y="134" font-family="-apple-system, BlinkMacSystemFont, Inter, Segoe UI, sans-serif" font-size="13" font-weight="600" fill="#71717a">ÁLGEBRA · FUNCIÓN CUADRÁTICA</text>
  <text x="96" y="182" font-family="Georgia, serif" font-size="34" font-weight="700" fill="#18181b">f(x) = ax² + bx + c</text>
  <text x="96" y="218" font-family="-apple-system, BlinkMacSystemFont, Inter, Segoe UI, sans-serif" font-size="15" fill="#52525b">donde a, b y c son números reales y a ≠ 0</text>

  <!-- Parabola graph illustration -->
  <line x1="430" y1="260" x2="590" y2="260" stroke="#a1a1aa" stroke-width="1.5"/>
  <line x1="510" y1="130" x2="510" y2="310" stroke="#a1a1aa" stroke-width="1.5"/>
  <path d="M 455 145 Q 510 315 565 145" fill="none" stroke="#3b82f6" stroke-width="3"/>

  <!-- LSC Interpreter PiP Window -->
  <rect x="660" y="114" width="236" height="210" rx="8" fill="#18181b" stroke="#3f3f46" stroke-width="1.5"/>
  <rect x="660" y="114" width="236" height="26" rx="8" fill="#18181b"/>
  <line x1="660" y1="140" x2="896" y2="140" stroke="#27272a"/>
  <text x="672" y="131" font-family="-apple-system, BlinkMacSystemFont, Inter, Segoe UI, sans-serif" font-size="10.5" font-weight="600" fill="#a1a1aa">Intérprete LSC</text>
  <rect x="786" y="119" width="48" height="16" rx="3" fill="#27272a"/>
  <text x="810" y="130" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Inter, Segoe UI, sans-serif" font-size="9" fill="#fafafa">Posición</text>
  <rect x="838" y="119" width="48" height="16" rx="3" fill="#27272a"/>
  <text x="862" y="130" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Inter, Segoe UI, sans-serif" font-size="9" fill="#fafafa">Ampliar</text>

  <!-- Interpreter silhouette -->
  <circle cx="778" cy="188" r="22" fill="#3f3f46"/>
  <path d="M 736 276 C 736 236 820 236 820 276 Z" fill="#3f3f46"/>
  <circle cx="742" cy="226" r="9" fill="#3b82f6"/>
  <circle cx="814" cy="220" r="9" fill="#3b82f6"/>

  <!-- Synchronized Subtitles Strip (CC) -->
  <rect x="84" y="334" width="792" height="36" rx="6" fill="#ffffff" stroke="#d4d4d8"/>
  <text x="480" y="357" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Inter, Segoe UI, sans-serif" font-size="13.5" font-weight="600" fill="#18181b">Una ecuación de segundo grado tiene la forma ax² + bx + c = 0, donde el coeficiente a es distinto de cero.</text>

  <!-- Unified Video Control Bar -->
  <rect x="48" y="382" width="864" height="68" fill="#18181b"/>
  <!-- Scrubber track -->
  <rect x="64" y="392" width="832" height="4" rx="2" fill="#3f3f46"/>
  <rect x="64" y="392" width="310" height="4" rx="2" fill="#3b82f6"/>
  <circle cx="374" cy="394" r="6" fill="#3b82f6"/>

  <!-- Left controls: Play, Restart, Volume, Time -->
  <rect x="64" y="406" width="32" height="32" rx="6" fill="#27272a"/>
  <polygon points="77,416 77,428 87,422" fill="#fafafa"/>
  <rect x="102" y="406" width="32" height="32" rx="6" fill="transparent"/>
  <circle cx="118" cy="422" r="6" fill="none" stroke="#fafafa" stroke-width="1.8"/>
  <rect x="140" y="406" width="32" height="32" rx="6" fill="transparent"/>
  <polygon points="150,420 154,420 159,416 159,428 154,424 150,424" fill="#fafafa"/>
  <text x="184" y="426" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#a1a1aa">01:18 / 03:42</text>

  <!-- Right controls: Speed segmented, A-B, CC, LSC, Split, Fullscreen -->
  <rect x="572" y="409" width="114" height="26" rx="5" fill="#09090b" stroke="#27272a"/>
  <text x="592" y="426" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Inter, Segoe UI, sans-serif" font-size="10.5" font-weight="600" fill="#a1a1aa">0.25×</text>
  <text x="631" y="426" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Inter, Segoe UI, sans-serif" font-size="10.5" font-weight="600" fill="#a1a1aa">0.5×</text>
  <rect x="652" y="412" width="30" height="20" rx="4" fill="#27272a"/>
  <text x="667" y="426" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Inter, Segoe UI, sans-serif" font-size="10.5" font-weight="600" fill="#fafafa">1×</text>

  <text x="708" y="426" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Inter, Segoe UI, sans-serif" font-size="11" font-weight="600" fill="#a1a1aa">A-B</text>
  <text x="748" y="425" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Inter, Segoe UI, sans-serif" font-size="11.5" font-weight="700" fill="#fafafa">CC</text>
  <rect x="738" y="432" width="20" height="2.5" rx="1" fill="#3b82f6"/>
  <text x="788" y="425" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Inter, Segoe UI, sans-serif" font-size="11.5" font-weight="700" fill="#fafafa">LSC</text>
  <rect x="776" y="432" width="24" height="2.5" rx="1" fill="#3b82f6"/>

  <!-- Split & Fullscreen icons -->
  <rect x="820" y="415" width="7" height="14" rx="1.5" fill="none" stroke="#fafafa" stroke-width="1.5"/>
  <rect x="830" y="415" width="7" height="14" rx="1.5" fill="none" stroke="#fafafa" stroke-width="1.5"/>
  <rect x="862" y="415" width="14" height="14" rx="1.5" fill="none" stroke="#fafafa" stroke-width="1.5"/>

  <!-- Quick Vocabulary Panel -->
  <rect x="48" y="466" width="864" height="54" rx="10" fill="#ffffff" stroke="#e4e4e7"/>
  <rect x="66" y="480" width="84" height="26" rx="6" fill="#fafafa" stroke="#e4e4e7"/>
  <text x="108" y="497" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Inter, Segoe UI, sans-serif" font-size="11.5" font-weight="500" fill="#18181b">Ecuación</text>
  <rect x="158" y="480" width="108" height="26" rx="6" fill="#fafafa" stroke="#e4e4e7"/>
  <text x="212" y="497" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Inter, Segoe UI, sans-serif" font-size="11.5" font-weight="500" fill="#18181b">Raíz Cuadrada</text>
  <rect x="274" y="480" width="86" height="26" rx="6" fill="#fafafa" stroke="#e4e4e7"/>
  <text x="317" y="497" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Inter, Segoe UI, sans-serif" font-size="11.5" font-weight="500" fill="#18181b">Constante</text>
  <rect x="368" y="480" width="132" height="26" rx="6" fill="#fafafa" stroke="#e4e4e7"/>
  <text x="434" y="497" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Inter, Segoe UI, sans-serif" font-size="11.5" font-weight="500" fill="#18181b">Función Cuadrática</text>
  <rect x="508" y="480" width="86" height="26" rx="6" fill="#fafafa" stroke="#e4e4e7"/>
  <text x="551" y="497" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Inter, Segoe UI, sans-serif" font-size="11.5" font-weight="500" fill="#18181b">Polinomio</text>
  <rect x="602" y="480" width="84" height="26" rx="6" fill="#fafafa" stroke="#e4e4e7"/>
  <text x="644" y="497" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Inter, Segoe UI, sans-serif" font-size="11.5" font-weight="500" fill="#18181b">Monomio</text>
</svg>
